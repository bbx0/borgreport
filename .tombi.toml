toml-version = "v1.1.0"

[[schemas]]
path = "tombi://www.schemastore.org/cargo.json"
include = ["Cargo.toml"]
format.rules = {
  array-values-order.enabled = false,
  table-keys-order.enabled = false
}
overrides = [
  {
    targets = [
      "dependencies",
      "dev-dependencies",
      "build-dependencies",
    ],
    format.rules.table-keys-order = "ascending"
  },
  { targets = ["package"], format.rules.table-keys-order = "schema" }
]

[[overrides]]
files.include = ["Cargo.toml"]
format.rules = {
  line-width = 160,
  trailing-comment-alignment = true,
  trailing-comment-space-width = 1
}
lint.rules.tables-out-of-order = "off"
